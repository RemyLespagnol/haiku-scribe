name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # the hooks must run on Debian dash + mawk and macOS /bin/sh + BSD awk
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Contract test
        run: python3 test_contract.py
      - name: Route hook test
        run: python3 test_route.py
      - name: Lint
        run: ruff check
      - name: Validate plugin manifests
        run: npx -y @anthropic-ai/claude-code plugin validate .
